name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: caseer_test
      DB_USERNAME: caseer
      DB_PASSWORD: caseer
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: caseer_test
          POSTGRES_USER: caseer
          POSTGRES_PASSWORD: caseer
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U caseer -d caseer_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pgsql, pdo_pgsql
          coverage: none
          tools: composer:v2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install frontend dependencies
        run: npm install
      - name: Prepare environment
        run: cp .env.example .env
      - name: Generate application key
        run: php artisan key:generate
      - name: Build assets
        run: npm run build
      - name: Run migrations
        run: php artisan migrate --force
      - name: Run test suite
        run: php artisan test
